# Nightly database backup, encrypted, kept for 30 days as a workflow
# artifact. Off until both repository secrets exist (Settings → Secrets
# and variables → Actions):
#   BACKUP_DATABASE_URL  postgres://… connection string of the production
#                        database (on Railway: the Postgres service's
#                        DATABASE_PUBLIC_URL)
#   BACKUP_PASSPHRASE    a long random passphrase; keep a copy somewhere
#                        safe — without it the backups can't be opened
# Restoring: see docs/BACKUPS.md.
name: Database backup

on:
  schedule:
    - cron: "17 21 * * *" # 02:17 in Pakistan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        id: config
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Backups are off: set the BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets to turn them on."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump and encrypt
        if: steps.config.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          file="ucp-noticeboard-$(date -u +%Y-%m-%d).dump.gpg"
          # A newer pg_dump can read any older server, so the client
          # version never has to match Railway's.
          docker run --rm -e DATABASE_URL postgres:17 sh -c 'pg_dump --format=custom --no-owner --no-acl "$DATABASE_URL"' \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$PASSPHRASE" --output "$file"
          test "$(stat -c %s "$file")" -gt 1000
          echo "FILE=$file" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
          if-no-files-found: error
