# Deploys main to the Oracle server after CI passes. Off until these repository secrets exist
# (Settings → Secrets and variables → Actions), see docs/ORACLE.md:
#   ORACLE_HOST     the server's address (IP or name)
#   ORACLE_SSH_KEY  the private key setup.sh made (it can only deploy and back up)
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Run by hand (Actions → Deploy → Run workflow): main's latest commit again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Work out what to deploy
        id: target
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$SHA" ]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          else
            sha=$SHA
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha to production"

      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.ORACLE_HOST }}
          KEY: ${{ secrets.ORACLE_SSH_KEY }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          if [ -z "$HOST" ] || [ -z "$KEY" ]; then
            echo "::notice::Deploys are off: set the ORACLE_HOST and ORACLE_SSH_KEY secrets to turn them on."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # The key's forced command on the server runs: deploy <environment> <commit>
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 \
            "ubuntu@$HOST" "deploy production $SHA"
