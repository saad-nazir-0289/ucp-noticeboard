name: Diagnose speed
on:
  push:
    branches: [claude/happy-mayer-9oduvh]
    paths: [.github/workflows/diag-share.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== where the server is"
          curl -s https://ipinfo.io/137.23.41.179 | grep -E '"(city|region|country|org)"'
          echo "== ping"
          ping -c 5 137.23.41.179 | tail -2 || true
          F='dns=%{time_namelookup} connect=%{time_connect} tls=%{time_appconnect} firstbyte=%{time_starttransfer} total=%{time_total} size=%{size_download} code=%{http_code}\n'
          for i in 1 2 3; do
            echo "-- round $i"
            printf "health        "; curl -s -o /dev/null -w "$F" https://ucpnb-api.duckdns.org/health
            printf "share (db)    "; curl -s -o /dev/null -w "$F" "https://ucpnb-api.duckdns.org/share/notice/62?r=$RANDOM"
            printf "pwa html      "; curl -s -o /dev/null -w "$F" https://ucp-noticeboard.msndev.workers.dev/
          done
          echo "== reuse one connection for 5 requests"
          curl -s -o /dev/null -o /dev/null -o /dev/null -o /dev/null -o /dev/null -w "$F" https://ucpnb-api.duckdns.org/health https://ucpnb-api.duckdns.org/health https://ucpnb-api.duckdns.org/health https://ucpnb-api.duckdns.org/health https://ucpnb-api.duckdns.org/health
          echo "== response headers"
          curl -sI https://ucpnb-api.duckdns.org/health | grep -iE 'server|alt-svc|content-encoding|via'
          curl -sI -H 'Accept-Encoding: gzip, br' https://ucpnb-api.duckdns.org/share/notice/62 | grep -iE 'content-encoding|content-length'
