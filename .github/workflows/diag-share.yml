name: Diagnose share preview
on:
  push:
    branches: [claude/happy-mayer-9oduvh]
    paths: [.github/workflows/diag-share.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          BASE="https://res.cloudinary.com/yehmyd3g/image/upload"
          IMG="v1792134647/tx9lsglh9etvtvh4ists.jpg"
          PID="tx9lsglh9etvtvh4ists"
          for t in \
            "w_1200,h_630,c_pad,b_auto,q_auto,f_jpg" \
            "w_1200,h_630,c_pad,b_auto:predominant,q_auto,f_jpg" \
            "w_1200,h_630,c_pad,b_blurred,q_auto,f_jpg" \
            "w_1200,h_630,c_pad,b_blurred:400,q_auto,f_jpg" \
            "w_1200,h_630,c_fill,e_blur:2000,b_black/l_${PID},w_1200,h_630,c_fit/fl_layer_apply/q_auto,f_jpg" ; do
            curl -s -o img.bin -D hdr.txt -w "status=%{http_code} bytes=%{size_download} time=%{time_total}s  $t\n" "$BASE/$t/$IMG"
            grep -i '^x-cld-error' hdr.txt || true
            python3 -c "d=open('img.bin','rb').read(); import struct; i=d.find(b'\xff\xc0'); print('  jpeg size', struct.unpack('>HH', d[i+5:i+9])[::-1] if i>0 else None)" || true
          done
