name: Diagnose notice deadlines
on:
  push:
    branches: [claude/happy-mayer-9oduvh]
    paths: [.github/workflows/diag-share.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in $(seq 40 90); do
            page=$(curl -s "https://ucpnb-api.duckdns.org/share/notice/$id?d=$RANDOM")
            t=$(echo "$page" | grep -o 'og:title" content="[^"]*' | sed 's/.*content="//')
            d=$(echo "$page" | grep -o 'og:description" content="[^"]*' | sed 's/.*content="//')
            [ "$t" = "UCP NoticeBoard" ] && continue
            echo "$id | $t | $d"
          done
