<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UCP NoticeBoard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="icon128.png" alt="" width="36" height="36" />
      <div>
        <h1>UCP NoticeBoard</h1>
        <p id="version">Version</p>
      </div>
    </header>

    <label class="switch-row">
      <span>
        <strong>Show on Horizon dashboard</strong>
        <small id="switch-note">Campus notices appear on your dashboard.</small>
      </span>
      <input id="enabled" type="checkbox" role="switch" checked />
      <span class="switch" aria-hidden="true"></span>
    </label>

    <nav class="links">
      <button data-open="horizon">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z" /></svg>
        Open Horizon dashboard
      </button>
      <button data-open="app">
        <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5" /><path d="M11 18h2" /></svg>
        Open the web app
      </button>
      <button id="qr-toggle" aria-expanded="false" aria-controls="qr">
        <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
        Get notifications on your phone
      </button>
      <div id="qr" class="qr" hidden>
        <img src="qr-notifications.svg" alt="QR code that opens NoticeBoard on your phone to turn on notifications" width="168" height="168" />
        <p><strong>Scan with your phone's camera.</strong> NoticeBoard opens and asks to turn on notifications. Tap Allow.</p>
      </div>
      <hr />
      <button data-open="review">
        <svg viewBox="0 0 24 24"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z" /></svg>
        Rate on the Chrome Web Store
      </button>
      <button data-open="github">
        <svg viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.9a3.4 3.4 0 0 0-.9-2.6c3.1-.4 6.4-1.5 6.4-6.9A5.4 5.4 0 0 0 20 4.8 5 5 0 0 0 19.9 1S18.7.6 16 2.5a13.4 13.4 0 0 0-7 0C6.3.6 5.1 1 5.1 1A5 5 0 0 0 5 4.8a5.4 5.4 0 0 0-1.5 3.8c0 5.4 3.3 6.5 6.4 6.9a3.4 3.4 0 0 0-.9 2.6V22" /></svg>
        Star on GitHub
      </button>
      <button data-open="contact">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
        Contact the developer
      </button>
      <button data-open="privacy">
        <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>
        Privacy policy
      </button>
    </nav>

    <script src="popup-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
