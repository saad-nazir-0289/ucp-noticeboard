<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock UCP Portal — Dashboard</title>
  <!--
    A stand-in for https://horizon.ucp.edu.pk/student/dashboard, for local
    previews only. It reproduces just the structure the extension depends
    on (see extension/src/content/studentIdentity.ts and index.tsx):
      - h2.heading_b > .uk-text-truncate (name) + .sub-heading (Roll Number)
      - a "Classes, Grades and Attendance" heading inside a uk-width-* wrapper
    and then loads the locally built content.js, exactly as Chrome would.

    ?roll=L1F21BSCS0002&name=Computing%20Society picks the student shown.
  -->
  <style>
    body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #eef1f5; color: #212121; }
    .mock-banner { background: #fff3cd; color: #664d03; padding: 6px 16px; font-size: 13px; text-align: center; }
    .topbar { background: #12395c; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 500; }
    .page { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    .heading_b { margin: 0 0 24px; font-size: 22px; font-weight: 400; }
    .heading_b .sub-heading { display: block; font-size: 14px; color: #727272; margin-top: 4px; }
    .uk-grid { display: flex; flex-wrap: wrap; gap: 24px; }
    .uk-width-1-1 { width: 100%; }
    .md-card { background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 16px 24px; }
    .md-card h3 { margin: 0 0 12px; font-size: 16px; font-weight: 500; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div class="mock-banner">Mock UCP portal — local preview of the NoticeBoard extension</div>
  <div class="topbar">UCP Horizon</div>
  <div class="page">
    <h2 class="heading_b">
      <span class="uk-text-truncate" id="student-name"></span>
      <span class="sub-heading" id="student-roll"></span>
      <span class="sub-heading">BS Computer Science</span>
    </h2>
    <div class="uk-grid">
      <div class="uk-width-1-1">
        <div class="md-card">
          <h3>Classes, Grades and Attendance</h3>
          <table>
            <thead><tr><th>Course</th><th>Section</th><th>Attendance</th><th>Grade</th></tr></thead>
            <tbody>
              <tr><td>Data Structures</td><td>A</td><td>92%</td><td>A-</td></tr>
              <tr><td>Operating Systems</td><td>B</td><td>88%</td><td>B+</td></tr>
              <tr><td>Software Engineering</td><td>A</td><td>95%</td><td>A</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("student-name").textContent = params.get("name") || "Ayesha Khan";
    document.getElementById("student-roll").textContent = params.get("roll") || "L1F23BSCS0004";
  </script>
  <script src="/extension/content.js"></script>
</body>
</html>
