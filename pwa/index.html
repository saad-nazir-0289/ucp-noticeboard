<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UCP NoticeBoard</title>
    <meta name="description" content="Campus notices from UCP, on your phone." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b111c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <!-- iOS only shows push notifications to PWAs that have actually been
         added to the home screen — this line is what makes "Add to Home
         Screen" behave like a real installed app rather than a bookmark. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Starts the DNS lookup + TLS handshake for these before the app's
         JS even runs its first fetch — shaves that round trip off the
         very first request instead of paying for it inline. -->
    <link rel="preconnect" href="%VITE_API_BASE_URL%" />
    <link rel="preconnect" href="https://res.cloudinary.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
